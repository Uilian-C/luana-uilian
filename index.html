<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luana & Uilian | Nosso Casamento</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;700&family=Montserrat:wght@400;500;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        /* (Seu CSS permanece o mesmo) */
        tailwind.config = {
            theme: {
                extend: {
                    colors: { 'sage-green': '#A3B18A', 'olive-green': '#588157', 'hunter-green': '#3A5A40', 'cream-white': '#FEFAE0', 'warm-beige': '#DDA15E', 'dark-charcoal': '#283618' },
                    fontFamily: { 'display': ['Cormorant Garamond', 'serif'], 'sans': ['Montserrat', 'sans-serif'], 'script': ['Great Vibes', 'cursive'] }
                }
            }
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.8s ease-out forwards; }
        body { background-color: #FEFAE0; background-image: url('https://www.transparenttextures.com/patterns/elegant-flowers.png'); background-attachment: fixed; font-family: 'Montserrat', 'sans-serif'; color: #283618; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #588157; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .upload-indicator { display: flex; align-items: center; justify-content: center; background-color: rgba(255, 255, 255, 0.8); border-radius: 0.5rem; }
    </style>
</head>
<body class="bg-cream-white">

    <main class="container mx-auto px-6 py-12">
        <section id="fotos" class="mb-20 text-center bg-white/70 p-10 rounded-lg shadow-xl backdrop-blur-sm fade-in">
            <h2 class="text-5xl font-display text-hunter-green mb-4">Mural de Memórias</h2>
            <p class="max-w-2xl mx-auto text-lg mb-8">Seus registros tornarão nosso dia ainda mais especial! Compartilhe aqui suas fotos favoritas do nosso casamento. Use a hashtag <strong class="text-olive-green">#LuanaEUilian2025</strong> nas redes sociais!</p>
            <div class="max-w-md mx-auto">
                <label for="photo-upload" class="cursor-pointer bg-olive-green hover:bg-hunter-green text-cream-white font-bold py-3 px-8 rounded-full transition duration-300 inline-block shadow-lg">
                    <i class="fas fa-camera-retro mr-2"></i> Enviar uma Foto
                </label>
                <input type="file" id="photo-upload" class="hidden" accept="image/*" multiple>
            </div>
            <div id="photo-preview-gallery" class="mt-8 grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                </div>
        </section>

        </main>

    <script type="module">
        // Importações do Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // Configuração do seu Firebase
        const firebaseConfig = {
          apiKey: "AIzaSyCfqesuR8nIDYoXtLMvQQqzeHTFmAurLZA",
          authDomain: "casamento-luana-uilian.firebaseapp.com",
          projectId: "casamento-luana-uilian",
          storageBucket: "casamento-luana-uilian.appspot.com", // CORRIGIDO: O .appspot.com é o padrão para o storageBucket
          messagingSenderId: "305363486620",
          appId: "1:305363486620:web:c67a274d6aedc3cce1ea59"
        };

        // Inicializa serviços do Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);
        const auth = getAuth(app);

        // O restante do seu código JavaScript para o mural de fotos continua aqui...
        const photosCollection = collection(db, "photos");
        let currentUserId = null;
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUserId = user.uid;
                loadPhotos();
            } else {
                signInAnonymously(auth).catch((error) => console.error("Erro no login anônimo:", error));
            }
        });
        const photoGallery = document.getElementById('photo-preview-gallery');
        const photoUploadInput = document.getElementById('photo-upload');
        photoUploadInput.addEventListener('change', (e) => {
            const files = e.target.files;
            if (!currentUserId || !files.length) return;
            for (const file of files) { handlePhotoUpload(file); }
            e.target.value = '';
        });
        const handlePhotoUpload = async (file) => {
            const tempId = `temp_${Date.now()}`;
            const loaderHTML = `<div id="${tempId}" class="relative w-full h-48 rounded-lg overflow-hidden shadow-md upload-indicator"><div class="loader"></div></div>`;
            photoGallery.insertAdjacentHTML('afterbegin', loaderHTML);
            const filePath = `wedding_photos/${currentUserId}_${Date.now()}_${file.name}`;
            const storageRef = ref(storage, filePath);
            try {
                await uploadBytes(storageRef, file);
                const url = await getDownloadURL(storageRef);
                await addDoc(photosCollection, { imageUrl: url, storagePath: filePath, userId: currentUserId, createdAt: serverTimestamp() });
            } catch (error) {
                console.error("Erro no upload da foto:", error);
                alert("Ops! Algo deu errado ao enviar sua foto. Tente novamente.");
            } finally {
                 document.getElementById(tempId)?.remove();
            }
        };
        const createPhotoCard = (docData) => {
            const { imageUrl } = docData;
            const card = document.createElement('div');
            card.className = 'relative w-full h-48 rounded-lg overflow-hidden shadow-md fade-in group';
            card.innerHTML = `<img src="${imageUrl}" class="w-full h-full object-cover transform group-hover:scale-105 transition-transform duration-300" alt="Foto do casamento">`;
            return card;
        };
        const loadPhotos = () => {
            onSnapshot(photosCollection, (snapshot) => {
                photoGallery.innerHTML = '';
                snapshot.docs
                    .map(doc => ({ id: doc.id, ...doc.data() }))
                    .sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0))
                    .forEach(docData => photoGallery.appendChild(createPhotoCard(docData)));
            });
        };
    </script>
    
</body>
</html>
